<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CamReview</title>
  <script>
    /* GitHub Pages 的路徑分大小寫且不能做伺服器端轉址（shared.md §16）。
     * 這一頁把大小寫寫錯的站內網址導回正確的位置。 */
    (function () {
      var MAP = { "": "", "index.html": "index.html" };
      var parts = location.pathname.replace(/^\/CamReview\/?/i, "");
      var key = parts.toLowerCase();
      if (MAP[key] !== undefined) location.replace("/CamReview/" + MAP[key] + location.search + location.hash);
      else location.replace("/CamReview/");
    })();
  </script>
</head>
<body style="background:#0d0d10;color:#eceded;font-family:sans-serif;text-align:center;padding:60px 20px">
  <p>找不到這一頁，正在帶你回首頁…</p>
  <p><a href="/CamReview/" style="color:#e0a458">回 CamReview 首頁</a></p>
</body>
</html>
